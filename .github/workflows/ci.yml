name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify starter contract
        run: bash scripts/check-starter.sh

  # Shared security scan (gitleaks, Semgrep, OSV-Scanner, Trivy) from platform-ci-workflows.
  # The language CIs (ci-node.yml / ci-python.yml) do not fit yet: this starter has no stack,
  # so the starter contract above stays the build check until a product scaffold lands.
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@493a7f5c322219e61245cf17f1fa34de2c35a22b # v1.6.6
